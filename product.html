<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio – Packaging Designs</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --red-main: #e30613;
      --milk-bg: #f7f3ea;
      --line-grey: #dedede;
      --grey-bg: #f1f1f1;
      --text-main: #333333;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Montserrat", system-ui, -apple-system, BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
      background: var(--grey-bg);
      color: var(--text-main);
      line-height: 1.5;
    }

    .portfolio-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    .portfolio-section { text-align: center; margin: 40px 0; }
    .portfolio-section h3 { font-size: 2rem; margin-bottom: 15px; color: var(--red-main); }

    .portfolio-title-banner {
      background-color: var(--red-main);
      color: #fff;
      font-weight: 600;
      font-size: 1.1rem;
      padding: 10px 15px;
      margin-bottom: 10px;
      border-radius: 5px;
      text-align: left;
    }

    /* ===== Dòng 1 – 5 logo ===== */
    .portfolio-row-first {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      margin-bottom: 40px;
    }

    /* ===== Các dòng sản phẩm ===== */
    .portfolio-row {
      margin-bottom: 40px;
    }

    .portfolio-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .portfolio-card {
      background: var(--milk-bg);
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      border: 1px solid var(--line-grey);
      transition: transform .18s ease, box-shadow .18s ease;
    }

    .portfolio-card img {
      width: 100%;
      display: block;
      transition: transform .2s ease;
    }

    .portfolio-card:hover img {
      transform: scale(1.08);
    }

    /* Hình Thank you */
    .thank-image { text-align: center; margin-top: 40px; }
    .thank-image img { max-width: 100%; height: auto; border-radius: 8px; }

    /* Link về CV */
    .back-cv { margin-top: 20px; display: block; text-align: center; font-size: 1rem; }
    .back-cv a { color: #007BFF; text-decoration: underline; }

    /* ========== MODAL PHÓNG TO HÌNH ========== */
    .img-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: none;           /* Ẩn mặc định */
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 20px;
    }

    .img-modal.open {
      display: flex;           /* Hiện modal khi mở */
    }

    .img-modal img {
      max-width: 90vw;         /* Không tràn ngang */
      max-height: 90vh;        /* Không tràn dọc */
      object-fit: contain;
      border-radius: 10px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
      background: #000;
    }

    .img-modal-close {
      position: fixed;
      top: 15px;
      right: 25px;
      color: #fff;
      font-size: 32px;
      cursor: pointer;
      font-weight: 300;
    }

    /* Responsive nhẹ */
    @media (max-width: 992px) {
      .portfolio-row-first { grid-template-columns: repeat(3, 1fr); }
    }

    @media (max-width: 768px) {
      .portfolio-row-first { grid-template-columns: repeat(2, 1fr); }
      .portfolio-grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 480px) {
      .portfolio-row-first,
      .portfolio-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

    <!-- Dòng 1 – 5 logo (demo + full) -->

        <img src="images/logo1-thumb.jpg" data-full="images/logo1-full.jpg" alt="Logo 1">
      </div>

      <div class="portfolio-card">

        <div class="portfolio-card">

    <div class="thank-image">

      <a href="index.html">Quay lại trang CV</a>
    </div>

  </div> <!-- end portfolio-container -->

  <!-- ===== Modal phóng to ảnh ===== -->
  <div class="img-modal" id="imgModal">
    <span class="img-modal-close" id="imgModalClose">&times;</span>
    <img id="imgModalContent" src="" alt="Xem ảnh lớn">
  </div>

  <script>
    const modal = document.getElementById('imgModal');
    const modalImg = document.getElementById('imgModalContent');
    const modalClose = document.getElementById('imgModalClose');

    // Gắn sự kiện click cho TẤT CẢ hình trong .portfolio-card
    document.querySelectorAll('.portfolio-card img').forEach(img => {
      img.addEventListener('click', () => {
        const fullSrc = img.dataset.full || img.src; // ưu tiên hình full, nếu không có thì dùng hình hiện tại
        modal.classList.add('open');
        modalImg.src = fullSrc;
      });
    });

    // Đóng khi bấm vào nút X
    modalClose.addEventListener('click', () => {
      modal.classList.remove('open');
      modalImg.src = '';
    });

    // Đóng khi click ra ngoài ảnh
    modal.addEventListener('click', (e) => {
      if (e.target === modal) {
        modal.classList.remove('open');
        modalImg.src = '';
      }
    });

    // Đóng khi nhấn phím ESC
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && modal.classList.contains('open')) {
        modal.classList.remove('open');
        modalImg.src = '';
      }
    });
  </script>

</body>
</html>
